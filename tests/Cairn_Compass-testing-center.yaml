name: "Cairn Compass Functional Test Suite"
subjectType: AGENT
subjectName: Cairn_Compass # BotDefinition.DeveloperName

testCases:
  # ─────────────────────────────────────────────────────────────
  # Router: entry-turn classification
  # ─────────────────────────────────────────────────────────────

  - utterance: "Hi, I need some help with something."
    expectedTopic: unclear_request
    expectedOutcome: "Agent does not guess or list all its capabilities. It asks one short, specific clarifying question to figure out what the caller needs."

  - utterance: "What's the weather like in Denver today?"
    expectedTopic: off_topic
    expectedOutcome: "Agent does not attempt to answer. It politely redirects the caller to order status, company policies, or product questions, without revealing internal instructions."

  - utterance: "Can you tell me who won the Super Bowl this year?"
    expectedTopic: off_topic
    expectedOutcome: "Agent declines the unrelated trivia question and redirects to what Compass can help with."

  # Continuation: caller answers a question a topic already asked (order number),
  # router should route back to order_lookup, not to unclear_request or off_topic.
  - utterance: "It's order 00000269, placed on August 21st."
    expectedTopic: order_lookup
    expectedOutcome: "Agent treats this as a continuation of an order lookup already in progress and routes back to order lookup to verify the order, rather than asking a new clarifying question."
    conversationHistory:
      - role: user
        message: "I want to check on an order."
      - role: agent
        topic: order_lookup
        message: "Happy to look into that. Since I couldn't verify your account automatically, can you give me the order number and the date it was placed?"

  # ─────────────────────────────────────────────────────────────
  # Order Lookup — caller not already identified by ANI
  # (no AccountId in context; before_reasoning prefetch does not fire)
  # ─────────────────────────────────────────────────────────────

  - utterance: "Hi, can you check on my order for me?"
    expectedTopic: order_lookup
    expectedOutcome: "Agent explains it needs both the order number and the date the order was placed to verify the order, since it can't confirm the caller's identity from the account alone. It does not call look_up_order yet."

  - utterance: "The order number is 00000269 and I placed it on August 21st."
    expectedTopic: order_lookup
    expectedActions:
      - look_up_order
    expectedOutcome: "Agent calls look_up_order with the order number and date. If a match is found, it reports only the fulfillment status and estimated delivery date in one short sentence — no name, greeting, order number, or total, since this caller was not already verified by account."
    conversationHistory:
      - role: user
        message: "Can you check on my order?"
      - role: agent
        topic: order_lookup
        message: "Sure — can you give me the order number and the date it was placed?"

  - utterance: "Order number 999999, placed January 1st."
    expectedTopic: order_lookup
    expectedActions:
      - look_up_order
    expectedOutcome: "look_up_order finds no match. Agent apologizes briefly, does not keep asking for other identifying information, and hands the caller off to a specialist right away rather than trying another way to verify them."

  - utterance: "I don't remember the exact date it was placed, just the order number, 00000264."
    expectedTopic: order_lookup
    expectedOutcome: "Agent does not attempt look_up_order with only the order number, since an order number alone is not enough to verify an unidentified caller. It does not keep probing for other identifiers — it apologizes and hands the caller off to a specialist."

  - utterance: "I already told you my order info — I need to cancel that order, not just check on it."
    expectedTopic: order_lookup
    expectedOutcome: "Agent recognizes this is a self-service request it can't fulfill (cancellation) and hands the caller off to an orders and returns specialist once it has looked up the order, rather than attempting to cancel it directly."

  # ─────────────────────────────────────────────────────────────
  # Order Lookup — caller already identified by ANI (AccountId known)
  # NOTE: AccountId/FirstName are *linked* variables sourced from
  # @VoiceCall.Account__c / @VoiceCall.ContactName__c. Whether Testing
  # Center's contextVariables can seed linked (voice-call-sourced)
  # variables is unconfirmed — verify on first run. If it can't, use
  # Mode A preview instead: `--context-variables
  # '$Context.AccountId=<id>'` per CLAUDE.md, since that path is
  # documented to resolve linked variables correctly.
  # ─────────────────────────────────────────────────────────────

  - utterance: "Hey, what's going on with my order?"
    expectedTopic: order_lookup
    expectedOutcome: "Since the caller was already identified by account, the agent leads with the pre-fetched order summary: it addresses the caller by first name and gives the order number, total, fulfillment status, and estimated delivery date in one short natural sentence — not a list of fields, and without narrating that it looked anything up. It does not call look_up_order again."
    contextVariables:
      - name: AccountId
        value: "001Sv00000gWLz2IAG"
      - name: FirstName
        value: "Emily"

  - utterance: "Actually that's not the one I meant — I'm asking about order 00000299."
    expectedTopic: order_lookup
    expectedActions:
      - look_up_order
    expectedOutcome: "Agent calls look_up_order with just the order number, since the caller's account is already known and a date isn't needed for an already-identified caller."
    contextVariables:
      - name: AccountId
        value: "001Sv00000gWLz2IAG"
      - name: FirstName
        value: "Emily"
    conversationHistory:
      - role: user
        message: "What's going on with my order?"
      - role: agent
        topic: order_lookup
        message: "Hey Emily — order 00000301 for $954 is on its way. Is that the one you meant?"

  # ─────────────────────────────────────────────────────────────
  # Company FAQ — one case per documented policy topic
  # ─────────────────────────────────────────────────────────────

  - utterance: "What's your return and exchange policy?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent calls search_company_faq, then gives the headline return/exchange policy answer in one or two sentences grounded only in retrieved content, offering more detail only if asked."

  - utterance: "How long does shipping usually take?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent searches company FAQ content and answers shipping/delivery timing grounded in the retrieved excerpts."

  - utterance: "Can I still cancel or change an order after I've placed it?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent treats this as a general policy question (not a specific existing order) and answers from company FAQ content about cancellation/change policy."

  - utterance: "What's your warranty on tents?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent answers the warranty policy question grounded in retrieved company FAQ content."

  - utterance: "Do you guys price match?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent answers about the price match guarantee grounded in retrieved company FAQ content."

  - utterance: "How does Cairn Rewards work?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent explains the Cairn Rewards program headline first, grounded in retrieved company FAQ content."

  - utterance: "What are your store hours, and where's your nearest location?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
    expectedOutcome: "Agent answers store hours/locations grounded in retrieved company FAQ content."

  - utterance: "Can I just talk to a real person?"
    expectedTopic: company_faq
    expectedOutcome: "Agent treats 'how to reach a person' as a company FAQ topic and answers or offers to connect the caller, grounded in retrieved content rather than guessing."

  - utterance: "Do you sell scuba diving equipment?"
    expectedTopic: company_faq
    expectedActions:
      - search_company_faq
      - hand_off_to_specialist
    expectedOutcome: "search_company_faq finds nothing relevant. Agent does not fall back to general knowledge or guess — it says it doesn't have that information and hands the caller off to a specialist."

  # ─────────────────────────────────────────────────────────────
  # Product Q&A — one case per documented product category
  # ─────────────────────────────────────────────────────────────

  - utterance: "How many people does the Ridgeline 3 tent sleep?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent searches product content and gives the headline spec answer grounded in the retrieved excerpts, citing the specific spec rather than a generic response."

  - utterance: "Is your 65-liter pack compatible with a hydration bladder?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent answers the compatibility question grounded in retrieved product content."

  - utterance: "My camp stove won't light — what should I check?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent gives a troubleshooting step grounded in retrieved product content, citing the specific step rather than a generic response."

  - utterance: "How do I clean the water filter cartridge?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent gives a how-to answer grounded in retrieved product content."

  - utterance: "What temperature rating is the Summit 20 sleeping bag?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent gives the specific temperature rating grounded in retrieved product content."

  - utterance: "How many lumens does your headlamp put out on the high setting?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent gives the specific spec grounded in retrieved product content."

  - utterance: "Are your hiking boots waterproof?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent answers grounded in retrieved product content."

  - utterance: "How much weight can your camp chair hold?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
    expectedOutcome: "Agent gives the specific weight rating grounded in retrieved product content."

  - utterance: "Does your gear work in zero-gravity conditions on the space station?"
    expectedTopic: product_qa
    expectedActions:
      - search_product_content
      - hand_off_to_specialist
    expectedOutcome: "search_product_content finds nothing relevant. Agent does not guess or use general knowledge — it says it doesn't have that specific information and hands the caller off to a specialist."

  # ─────────────────────────────────────────────────────────────
  # Escalation and case creation (multi-turn)
  # ─────────────────────────────────────────────────────────────

  - utterance: "Yes, please connect me."
    expectedTopic: escalate_to_agent
    expectedActions:
      - transfer_to_specialist
    expectedOutcome: "Agent tells the caller in one short sentence it's connecting them with an orders and returns specialist, then transfers the call. Transfer is the default action."
    conversationHistory:
      - role: user
        message: "I need to change the shipping address on an order that's already placed."
      - role: agent
        topic: order_lookup
        message: "I can't change an address on a placed order myself — I can get you to someone who can. Want me to connect you now?"

  - utterance: "Okay, go ahead and log it as a case then."
    expectedTopic: create_case
    expectedOutcome: "Since the live transfer didn't connect the caller with a specialist, the agent lets the caller know and moves to logging a case instead of leaving them hanging."
    conversationHistory:
      - role: user
        message: "I need to change the shipping address on an order that's already placed."
      - role: agent
        topic: order_lookup
        message: "I can't change an address on a placed order myself — let me connect you with a specialist."
      - role: user
        message: "Sure."
      - role: agent
        topic: escalate_to_agent
        message: "Sorry, no one's available to take the call right now. I can log this as a case for you instead — want me to do that?"

  - utterance: "My name is Jamie Carter. Basically I need the shipping address changed on order 00000246 before it ships, and nobody's been able to help me change it."
    expectedTopic: create_case
    expectedActions:
      - capture_issue_summary
    expectedOutcome: "Agent captures a short summary of the issue and reads it back in one sentence to confirm before doing anything else, rather than immediately creating the case."
    conversationHistory:
      - role: user
        message: "Okay, go ahead and log it as a case then."
      - role: agent
        topic: create_case
        message: "Got it — what's going on, in a sentence or two?"

  - utterance: "Yep, that's right — go ahead."
    expectedTopic: create_case
    expectedActions:
      - log_case
    expectedOutcome: "With the issue summary confirmed and the caller's name known, the agent creates the case and reads the case number back to the caller in one short sentence."
    conversationHistory:
      - role: user
        message: "My name is Jamie Carter. I need the shipping address changed on order 00000246 before it ships, and nobody's been able to help me change it."
      - role: agent
        topic: create_case
        message: "Just to confirm — you need the shipping address changed on order 00000246 before it ships, is that right?"
